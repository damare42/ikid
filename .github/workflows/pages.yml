# Publishes site/ to GitHub Pages on every push to main.
#
# The marketing site is a single static HTML file. The hosted demo under
# site/demo/ is not: it is built here from client/, shared/ and the pure
# engines in server/src/services/, and site/demo/ is gitignored precisely so
# that a stale build can't be committed.
#
# There is deliberately no `paths` filter. There used to be — `["site/**"]` —
# which meant the workflow watched the one directory the demo is *not* built
# from. Every fix to the application itself (the Planner, the chart palette,
# the mobile navigation) landed on main and the live demo stayed on an old
# bundle, silently, because nothing under site/ had changed. The demo is the
# only thing most visitors ever see, so it was the part of the project most
# likely to be wrong and least likely to look it.
#
# A paths list here is a second, hand-maintained copy of "what the demo build
# depends on", and it was already wrong. This job is a checkout, an npm ci and
# a vite build — a redundant deploy costs a minute, a stale demo costs the
# visitor's whole impression of the app.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Guard: the marketing site must never ship real data or secrets.
      - name: Assert the site is static and clean
        run: |
          if grep -rIlE "BEGIN (RSA|OPENSSH|PRIVATE)|api[_-]?key|secret[_-]?key" site/; then
            echo "::error::Possible secret in site/"; exit 1
          fi
          if ls site/*.db site/*.json 2>/dev/null | grep -q .; then
            echo "::error::Unexpected data file in site/"; exit 1
          fi
          echo "site/ is clean."

      # Every absolute URL on the site must agree with site.config.json, and
      # with site/CNAME if a custom domain is configured. Moving domains means
      # editing a CNAME, a base path and a handful of <head> URLs; miss the
      # base and every asset 404s, miss the canonical and the site keeps
      # telling search engines the old address is the real one. Neither
      # failure looks like a failure, so neither is left to inspection.
      - name: Assert the site's URLs match where it is deployed
        run: node scripts/verify-site-urls.mjs

      # The interactive demo is the real client, built with an in-browser API
      # instead of a server. Built here rather than committed, so ~900KB of
      # generated JavaScript stays out of the repository and can never drift
      # from the source it was built from.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # build:demo ends by running scripts/verify-demo-build.mjs, which checks
      # what a visitor actually receives: real utility classes in the
      # stylesheet, the demo dataset present, no server database code, and
      # asset URLs matching the deploy base. A build can succeed and still be
      # unusable — that already happened once — so the deploy fails here rather
      # than shipping it.
      - run: npm run build:demo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
