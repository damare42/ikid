# Publishes site/ to GitHub Pages on every push to main.
# The marketing site is a single static HTML file — no build step, no
# dependencies, nothing to compromise.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Guard: the marketing site must never ship real data or secrets.
      - name: Assert the site is static and clean
        run: |
          if grep -rIlE "BEGIN (RSA|OPENSSH|PRIVATE)|api[_-]?key|secret[_-]?key" site/; then
            echo "::error::Possible secret in site/"; exit 1
          fi
          if ls site/*.db site/*.json 2>/dev/null | grep -q .; then
            echo "::error::Unexpected data file in site/"; exit 1
          fi
          echo "site/ is clean."

      # The interactive demo is the real client, built with an in-browser API
      # instead of a server. Built here rather than committed, so ~900KB of
      # generated JavaScript stays out of the repository and can never drift
      # from the source it was built from.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:demo

      - name: Assert the demo carries no server code
        run: |
          # A Prisma client or a node builtin in the bundle would mean a
          # database-touching module got imported by mistake — it would fail at
          # runtime for every visitor, so fail the deploy instead.
          if grep -rlE "PrismaClient|@prisma/client" site/app/assets/ 2>/dev/null; then
            echo "::error::Server database code leaked into the demo bundle"; exit 1
          fi
          test -f site/app/index.html || { echo "::error::demo build produced no index.html"; exit 1; }
          echo "demo bundle is clean."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
