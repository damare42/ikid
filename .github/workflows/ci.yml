name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Database setup (generate + push + seed)
        run: npm run db:setup

      - name: Unit tests
        run: npm test

      - name: Typecheck + production build
        run: npm run build

      - name: Lint
        run: npm run lint
