# Static security analysis. Catches injection, path traversal, unsafe
# deserialization and similar in our own code — the classes of bug that matter
# most for an app that parses untrusted bank statements.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published queries run against existing code.
    - cron: "23 4 * * 1"

# Least privilege: read the repo, write only security findings.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Query set and path exclusions live in the config file, with the
          # reasoning written down next to them. Short version: this runs
          # `security-extended` (a superset of the default security queries)
          # over app code only — the previous `security-and-quality` run over
          # everything produced 253 alerts, which is more than anyone triages.
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
